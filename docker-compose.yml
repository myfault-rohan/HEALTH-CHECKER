version: '3.8'

services:
  web:
    build: .
    container_name: health_checker_web
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      db:
        condition: service_started
      ml:
        condition: service_healthy
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: health_checker_ml
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: health_checker_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
