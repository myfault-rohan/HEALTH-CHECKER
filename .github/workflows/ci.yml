name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate stub model for CI
        run: |
          python - <<'EOF'
          import pickle, os
          import numpy as np
          from sklearn.ensemble import HistGradientBoostingClassifier
          os.makedirs("model", exist_ok=True)
          # Tiny stub model so SHAP service can import without crashing
          X = np.random.randint(0, 2, (210, 45))
          y = [f"Disease_{i}" for i in range(105)] * 2
          m = HistGradientBoostingClassifier(max_iter=3, random_state=0)
          m.fit(X, y)
          with open("model/model.pkl", "wb") as f:
              pickle.dump(m, f)
          print("Stub model.pkl created")
          EOF

      - name: Lint with Ruff
        run: ruff check app/ tests/ predictor.py --output-format=github

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
          RATELIMIT_ENABLED: "False"
        run: python run_tests_ci.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest_output.log

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-checker-pro:ci .

      - name: Verify container starts
        run: |
          docker run -d --name hc-test \
            -e FLASK_SECRET_KEY=ci-test-key \
            -p 10000:10000 \
            health-checker-pro:ci
          sleep 5
          curl --retry 3 --retry-delay 2 --fail http://localhost:10000/ || exit 1
          docker stop hc-test
