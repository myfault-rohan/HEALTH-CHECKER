name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app/ tests/ predictor.py --output-format=github

      - name: Run tests with coverage
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: |
          pytest tests/ \
            --cov=app \
            --cov=predictor \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t health-checker-pro:ci .

      - name: Verify container starts
        run: |
          docker run -d --name hc-test \
            -e FLASK_SECRET_KEY=ci-test-key \
            -p 10000:10000 \
            health-checker-pro:ci
          sleep 5
          curl --retry 3 --retry-delay 2 --fail http://localhost:10000/ || exit 1
          docker stop hc-test
